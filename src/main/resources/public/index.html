<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Rental</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1">Vehicle Rental</span>
        <div class="nav nav-pills" id="tabs">
            <button class="nav-link active" data-tab="catalog">Catalog</button>
            <button class="nav-link" data-tab="reservations">Reservations</button>
            <button class="nav-link" data-tab="admin">Admin</button>
        </div>
    </div>
</nav>

<div class="container mb-5">
    <div id="alert-container" class="mb-3"></div>

    <section id="tab-catalog">
        <div class="row g-2 mb-3">
            <div class="col-md-4">
                <input id="search" class="form-control" placeholder="Search brand or model">
            </div>
            <div class="col-md-3">
                <select id="sort" class="form-select">
                    <option value="default">Sort: default</option>
                    <option value="priceAsc">Price: low to high</option>
                    <option value="priceDesc">Price: high to low</option>
                    <option value="seats">Seats: most first</option>
                </select>
            </div>
            <div class="col-md-5 text-md-end">
                <div class="btn-group" id="filter-group">
                    <button class="btn btn-outline-primary active" data-filter="ALL">All</button>
                    <button class="btn btn-outline-primary" data-filter="CAR">Car</button>
                    <button class="btn btn-outline-primary" data-filter="MOTORCYCLE">Motorcycle</button>
                    <button class="btn btn-outline-primary" data-filter="SCOOTER">Scooter</button>
                </div>
            </div>
        </div>

        <div id="vehicle-grid" class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-3"></div>

        <h2 class="h4 mt-5 mb-3">Reserve a vehicle</h2>
        <div class="card p-3">
            <p id="selected-label" class="text-muted">No vehicle selected</p>
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label" for="pickup-date">Pickup date</label>
                    <input type="date" id="pickup-date" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="return-date">Return date</label>
                    <input type="date" id="return-date" class="form-control">
                    <div class="form-text" id="duration-info">1 day(s)</div>
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="promo-code">Promo code (optional)</label>
                    <input type="text" id="promo-code" class="form-control" placeholder="ASTANA-IT or CORP10">
                    <div class="form-text">ASTANA-IT: -20% student discount | CORP10: -10% corporate</div>
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="customer-email">Confirmation email</label>
                    <input type="email" id="customer-email" class="form-control" placeholder="renter@example.com" value="renter@example.com">
                </div>

                <div class="col-md-12">
                    <label class="form-label">Extras</label><br>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input extra" type="checkbox" value="HELMET" id="x1">
                        <label class="form-check-label" for="x1" id="label-x1">Protective Helmet +1,000 KZT</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input extra" type="checkbox" value="CHILD_SEAT" id="x2">
                        <label class="form-check-label" for="x2" id="label-x2">Child seat +2,000 KZT</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input extra" type="checkbox" value="INSURANCE" id="x3">
                        <label class="form-check-label" for="x3">Insurance +10%</label>
                    </div>
                </div>

                <div class="col-md-12 border-top pt-3">
                    <label class="form-label fw-semibold">Payment card</label>
                    <div class="row g-2">
                        <div class="col-md-5">
                            <input type="text" id="card-number" class="form-control" placeholder="Card number (e.g. 4400 1234 5678 9012)" value="4400 1234 5678 9012" maxlength="19">
                        </div>
                        <div class="col-md-2">
                            <input type="text" id="card-expiry" class="form-control" placeholder="MM/YY" value="12/28" maxlength="5">
                        </div>
                        <div class="col-md-2">
                            <input type="password" id="card-cvv" class="form-control" placeholder="CVV" value="777" maxlength="3">
                        </div>
                        <div class="col-md-3 d-flex align-items-center">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="simulate-decline">
                                <label class="form-check-label text-danger" for="simulate-decline">Simulate declined payment</label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-12 d-flex align-items-center gap-2 mt-3">
                    <button id="quote-button" class="btn btn-outline-primary">Get quote</button>
                    <button id="checkout-button" class="btn btn-primary">Reserve</button>
                </div>
            </div>
            <div id="quote-result" class="mt-3" aria-live="polite"></div>
        </div>
    </section>

    <section id="tab-reservations" hidden>
        <h2 class="h4 mb-3">Reservations</h2>
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Vehicle</th>
                        <th>Email</th>
                        <th>Rental dates</th>
                        <th>Days</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="reservation-body"></tbody>
            </table>
        </div>
        <p id="no-reservations" class="text-muted" hidden>No reservations yet.</p>
    </section>

    <section id="tab-admin" hidden>
        <h2 class="h4 mb-3">Add vehicle</h2>
        <div class="card p-3">
            <form id="add-vehicle-form">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label" for="vehicle-type">Type</label>
                        <select id="vehicle-type" class="form-select">
                            <option>CAR</option>
                            <option>MOTORCYCLE</option>
                            <option>SCOOTER</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="vehicle-brand">Brand</label>
                        <input id="vehicle-brand" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="vehicle-model">Model</label>
                        <input id="vehicle-model" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="vehicle-seats">Seats</label>
                        <input type="number" id="vehicle-seats" class="form-control" min="1" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="vehicle-fuel">Fuel</label>
                        <input id="vehicle-fuel" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="vehicle-rate">Daily rate (KZT)</label>
                        <input type="number" id="vehicle-rate" class="form-control" min="1" step="100" required>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary">Add vehicle</button>
                    </div>
                </div>
            </form>
        </div>
    </section>
</div>

<script>
    const state = {
        vehicles: [],
        reservations: [],
        filter: "ALL",
        search: "",
        sort: "default",
        selected: null,
        rentalDays: 1
    };

    const $ = id => document.getElementById(id);

    function el(tag, cls, text) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text !== undefined) e.textContent = text;
        return e;
    }

    function formatKzt(val) {
        return Number(val).toLocaleString('en-US') + " KZT";
    }

    async function api(path, method = "GET", params) {
        const opts = { method };
        if (params) {
            opts.headers = { "Content-Type": "application/x-www-form-urlencoded" };
            opts.body = new URLSearchParams(params);
        }
        const res = await fetch(path, opts);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Request failed");
        return data;
    }

    function showAlert(message, type) {
        const box = $("alert-container");
        box.textContent = "";
        const div = el("div", "alert alert-" + type + " alert-dismissible");
        div.appendChild(el("span", null, message));
        const close = el("button", "btn-close");
        close.type = "button";
        close.addEventListener("click", () => box.textContent = "");
        div.appendChild(close);
        box.appendChild(div);
    }

    function vehicleName(v) { return v.brand + " " + v.model; }

    function renderVehicles() {
        const grid = $("vehicle-grid");
        grid.textContent = "";
        state.vehicles.forEach(v => {
            const col = el("div", "col");
            const card = el("div", "card h-100" + (state.selected === v.id ? " border-primary" : ""));
            const body = el("div", "card-body d-flex flex-column");
            const head = el("div", "d-flex justify-content-between align-items-start mb-2");
            head.appendChild(el("h5", "card-title mb-0", vehicleName(v)));

            const statusText = v.available ? "Available" : (v.rentedDates ? ("Rented: " + v.rentedDates) : (v.rentedUntil ? ("Rented until " + v.rentedUntil) : "Rented"));
            head.appendChild(el("span", "badge " + (v.available ? "bg-success" : "bg-secondary"), statusText));
            body.appendChild(head);

            body.appendChild(el("p", "mb-1 text-muted", v.type));
            body.appendChild(el("p", "mb-1", "Seats: " + v.seats));
            body.appendChild(el("p", "mb-1", "Fuel: " + v.fuel));
            body.appendChild(el("p", "fw-bold text-primary mb-3", formatKzt(v.dailyRate) + " / day"));

            const btn = el("button", "btn w-100 mt-auto " + (state.selected === v.id ? "btn-primary" : "btn-outline-primary"),
                state.selected === v.id ? "Selected" : "Select");
            btn.disabled = !v.available;
            btn.addEventListener("click", () => {
                state.selected = v.id;
                renderVehicles();
                renderSelected();
            });
            body.appendChild(btn);

            card.appendChild(body);
            col.appendChild(card);
            grid.appendChild(col);
        });

        if (state.selected) {
            const cur = state.vehicles.find(x => x.id === state.selected);
            if (cur && !cur.available) {
                state.selected = null;
                renderSelected();
            }
        }
    }

    function renderSelected() {
        const v = state.vehicles.find(x => x.id === state.selected);
        $("selected-label").textContent = v ? "Selected: " + vehicleName(v) + " (" + formatKzt(v.dailyRate) + " / day)" : "No vehicle selected";

        const helmetCheck = $("x1");
        const seatCheck = $("x2");
        const helmetLabel = $("label-x1");
        const seatLabel = $("label-x2");

        if (v) {
            if (v.type === "CAR") {
                helmetCheck.checked = false;
                helmetCheck.disabled = true;
                helmetLabel.textContent = "Helmet (moto & scooters only)";

                seatCheck.disabled = false;
                seatLabel.textContent = "Child seat +2,000 KZT";
            } else {
                helmetCheck.disabled = false;
                helmetLabel.textContent = "Protective Helmet +1,000 KZT";

                seatCheck.checked = false;
                seatCheck.disabled = true;
                seatLabel.textContent = "Child seat (cars only)";
            }
        } else {
            helmetCheck.disabled = false;
            helmetLabel.textContent = "Protective Helmet +1,000 KZT";
            seatCheck.disabled = false;
            seatLabel.textContent = "Child seat +2,000 KZT";
        }
    }

    function renderReservations() {
        const body = $("reservation-body");
        body.textContent = "";
        $("no-reservations").hidden = state.reservations.length > 0;
        state.reservations.forEach(r => {
            const tr = el("tr");
            const v = state.vehicles.find(x => x.id === r.vehicleId);
            tr.appendChild(el("td", null, r.id.substring(0, 8)));
            tr.appendChild(el("td", null, v ? vehicleName(v) : r.vehicleId));
            tr.appendChild(el("td", null, r.email));

            const datesText = (r.startDate && r.endDate) ? (r.startDate + " to " + r.endDate) : "-";
            tr.appendChild(el("td", null, datesText));

            tr.appendChild(el("td", null, String(r.rentalDays)));
            tr.appendChild(el("td", null, formatKzt(r.totalPrice)));

            const colors = { ACTIVE: "bg-primary", CANCELLED: "bg-secondary", COMPLETED: "bg-success" };
            const st = el("td");
            st.appendChild(el("span", "badge " + colors[r.status], r.status));
            tr.appendChild(st);

            const actions = el("td", "text-end");
            if (r.status === "ACTIVE") {
                const done = el("button", "btn btn-sm btn-success me-1", "Return");
                done.addEventListener("click", () => act(r.id, "complete"));
                const cancel = el("button", "btn btn-sm btn-outline-danger", "Cancel");
                cancel.addEventListener("click", () => act(r.id, "cancel"));
                actions.appendChild(done);
                actions.appendChild(cancel);
            }
            tr.appendChild(actions);
            body.appendChild(tr);
        });
    }

    async function act(id, action) {
        try {
            await api("/api/reservations/" + id + "/" + action, "POST", {});
            showAlert("Reservation " + (action === "cancel" ? "cancelled" : "completed"), "success");
            await refresh();
        } catch (e) {
            showAlert(e.message, "danger");
        }
    }

    async function fetchVehicles() {
        const params = new URLSearchParams();
        if (state.search) params.set("search", state.search);
        if (state.filter && state.filter !== "ALL") params.set("type", state.filter);
        if (state.sort && state.sort !== "default") params.set("sort", state.sort);

        const pickup = $("pickup-date") ? $("pickup-date").value : null;
        const returnD = $("return-date") ? $("return-date").value : null;
        if (pickup) params.set("startDate", pickup);
        if (returnD) params.set("endDate", returnD);

        const qs = params.toString();
        state.vehicles = await api("/api/vehicles" + (qs ? "?" + qs : ""));
        renderVehicles();
        renderSelected();
    }

    async function refresh() {
        await fetchVehicles();
        state.reservations = await api("/api/reservations");
        renderReservations();
    }

    function initDates() {
        const today = new Date();
        const tomorrow = new Date();
        tomorrow.setDate(today.getDate() + 1);

        const formatDate = d => d.toISOString().split('T')[0];
        const todayStr = formatDate(today);
        const tomorrowStr = formatDate(tomorrow);

        $("pickup-date").min = todayStr;
        $("pickup-date").value = todayStr;
        $("return-date").min = tomorrowStr;
        $("return-date").value = tomorrowStr;

        updateRentalDays();
    }

    function onPickupChange() {
        const pickupStr = $("pickup-date").value;
        if (!pickupStr) return;
        const p = new Date(pickupStr);
        const minReturn = new Date(p);
        minReturn.setDate(p.getDate() + 1);
        const minReturnStr = minReturn.toISOString().split('T')[0];
        $("return-date").min = minReturnStr;

        const r = new Date($("return-date").value);
        if (isNaN(r.getTime()) || r <= p) {
            $("return-date").value = minReturnStr;
        }
        updateRentalDays();
        fetchVehicles();
    }

    function onReturnChange() {
        const p = new Date($("pickup-date").value);
        const r = new Date($("return-date").value);
        if (r <= p) {
            showAlert("Return date must be after pickup date", "warning");
            const minReturn = new Date(p);
            minReturn.setDate(p.getDate() + 1);
            $("return-date").value = minReturn.toISOString().split('T')[0];
        }
        updateRentalDays();
        fetchVehicles();
    }

    function updateRentalDays() {
        const p = new Date($("pickup-date").value);
        const r = new Date($("return-date").value);
        let days = Math.round((r - p) / (1000 * 60 * 60 * 24));
        if (isNaN(days) || days < 1) days = 1;
        state.rentalDays = days;
        $("duration-info").textContent = days + " day(s)";
    }

    $("pickup-date").addEventListener("change", onPickupChange);
    $("return-date").addEventListener("change", onReturnChange);

    function orderData() {
        const pickup = $("pickup-date").value;
        const returnD = $("return-date").value;
        if (!pickup || !returnD) {
            throw new Error("Please select valid pickup and return dates");
        }
        const p = new Date(pickup);
        const r = new Date(returnD);
        if (r <= p) {
            throw new Error("Return date must be after pickup date");
        }

        const isDecline = $("simulate-decline").checked;
        const cardNum = $("card-number").value.replace(/\s+/g, '');
        const customerId = isDecline ? "declined" : ("card-" + (cardNum.slice(-4) || "0000"));

        return {
            vehicleId: state.selected || "",
            rentalDays: state.rentalDays || 1,
            startDate: pickup,
            endDate: returnD,
            pricing: $("promo-code").value.trim(),
            extras: Array.from(document.querySelectorAll(".extra:checked")).map(c => c.value).join(","),
            customerId: customerId,
            email: $("customer-email").value.trim()
        };
    }

    $("quote-button").addEventListener("click", async () => {
        try {
            const d = orderData();
            if (!d.vehicleId) return showAlert("Select an available vehicle first", "warning");
            const r = await api("/api/quote", "POST", d);
            const box = $("quote-result");
            box.textContent = "";
            const ul = el("ul", "mb-1");
            r.lines.forEach(l => ul.appendChild(el("li", null, l)));
            box.appendChild(ul);
            box.appendChild(el("strong", null, "Total: " + formatKzt(r.totalPrice)));
        } catch (e) {
            showAlert(e.message, "danger");
        }
    });

    $("checkout-button").addEventListener("click", async () => {
        try {
            const d = orderData();
            if (!d.vehicleId) return showAlert("Select an available vehicle first", "warning");
            const r = await api("/api/checkout", "POST", d);
            $("quote-result").textContent = "";
            showAlert("Booking confirmed. Reservation " + r.id.substring(0, 8) + ", total " + formatKzt(r.totalPrice), "success");
            state.selected = null;
            await refresh();
        } catch (e) {
            showAlert(e.message, "danger");
        }
    });

    $("search").addEventListener("input", e => { state.search = e.target.value; fetchVehicles(); });
    $("sort").addEventListener("change", e => { state.sort = e.target.value; fetchVehicles(); });

    $("filter-group").addEventListener("click", e => {
        if (e.target.tagName !== "BUTTON") return;
        document.querySelectorAll("#filter-group button").forEach(b => b.classList.remove("active"));
        e.target.classList.add("active");
        state.filter = e.target.dataset.filter;
        fetchVehicles();
    });

    $("tabs").addEventListener("click", e => {
        if (e.target.tagName !== "BUTTON") return;
        document.querySelectorAll("#tabs button").forEach(b => b.classList.remove("active"));
        e.target.classList.add("active");
        ["catalog", "reservations", "admin"].forEach(t => $("tab-" + t).hidden = (t !== e.target.dataset.tab));
    });

    $("add-vehicle-form").addEventListener("submit", async e => {
        e.preventDefault();
        try {
            await api("/api/vehicles", "POST", {
                type: $("vehicle-type").value,
                brand: $("vehicle-brand").value.trim(),
                model: $("vehicle-model").value.trim(),
                seats: $("vehicle-seats").value,
                fuel: $("vehicle-fuel").value.trim(),
                dailyRate: $("vehicle-rate").value
            });
            showAlert("Vehicle added", "success");
            e.target.reset();
            await refresh();
            document.querySelector("[data-tab='catalog']").click();
        } catch (err) {
            showAlert(err.message, "danger");
        }
    });

    initDates();
    refresh().catch(e => showAlert(e.message, "danger"));
</script>
</body>
</html>
