<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Rental</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card {
            transition: none;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Vehicle Rental</span>
        </div>
    </nav>

    <div class="container mb-5">
        <div id="alert-container" class="mb-4"></div>

        <section class="mb-5">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h4 mb-0">Vehicles</h2>
                <div class="btn-group" role="group" id="filter-group">
                    <button type="button" class="btn btn-outline-primary active" data-filter="ALL">All</button>
                    <button type="button" class="btn btn-outline-primary" data-filter="CAR">Car</button>
                    <button type="button" class="btn btn-outline-primary" data-filter="MOTORCYCLE">Motorcycle</button>
                    <button type="button" class="btn btn-outline-primary" data-filter="SCOOTER">Scooter</button>
                </div>
            </div>
            <div id="vehicle-grid" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3"></div>
        </section>

        <section class="mb-5">
            <h2 class="h4 mb-3">Reserve a vehicle</h2>
            <div class="card p-3">
                <form id="checkout-form">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label for="rental-days" class="form-label">Rental days</label>
                            <input type="number" id="rental-days" class="form-control" min="1" value="1" required>
                        </div>
                        <div class="col-md-3">
                            <label for="customer-id" class="form-label">Simulated payment token</label>
                            <input type="text" id="customer-id" class="form-control" value="demo-card-token" required>
                            <div class="form-text">Use "declined" to simulate a failed payment.</div>
                        </div>
                        <div class="col-md-3">
                            <label for="customer-email" class="form-label">Confirmation email</label>
                            <input type="email" id="customer-email" class="form-control" required>
                        </div>
                        <div class="col-md-3 d-flex align-items-end gap-2">
                            <button type="button" id="quote-button" class="btn btn-outline-primary">Get quote</button>
                            <button type="button" id="checkout-button" class="btn btn-primary">Reserve</button>
                        </div>
                    </div>
                </form>
                <p id="quote-result" class="mt-3 mb-0" aria-live="polite"></p>
            </div>
        </section>

        <section>
            <h2 class="h4 mb-3">Add vehicle</h2>
            <div class="card p-3">
                <form id="add-vehicle-form">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label for="vehicle-type" class="form-label">Type</label>
                            <select id="vehicle-type" class="form-select" required>
                                <option value="CAR">CAR</option>
                                <option value="MOTORCYCLE">MOTORCYCLE</option>
                                <option value="SCOOTER">SCOOTER</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="vehicle-brand" class="form-label">Brand</label>
                            <input type="text" id="vehicle-brand" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label for="vehicle-model" class="form-label">Model</label>
                            <input type="text" id="vehicle-model" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label for="vehicle-seats" class="form-label">Seats</label>
                            <input type="number" id="vehicle-seats" class="form-control" min="1" required>
                        </div>
                        <div class="col-md-4">
                            <label for="vehicle-fuel" class="form-label">Fuel</label>
                            <input type="text" id="vehicle-fuel" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label for="vehicle-rate" class="form-label">Daily rate</label>
                            <input type="number" id="vehicle-rate" class="form-control" min="0.01" step="0.01" required>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary">Add vehicle</button>
                        </div>
                    </div>
                </form>
            </div>
        </section>
    </div>

    <script>
        let vehicles = [];

        let currentFilter = "ALL";
        let selectedVehicleId = null;

        function showAlert(message, type) {
            const container = document.getElementById("alert-container");
            container.textContent = "";

            const alertDiv = document.createElement("div");
            alertDiv.className = "alert alert-" + type + " alert-dismissible fade show";
            alertDiv.setAttribute("role", "alert");

            const textSpan = document.createElement("span");
            textSpan.textContent = message;
            alertDiv.appendChild(textSpan);

            const closeBtn = document.createElement("button");
            closeBtn.type = "button";
            closeBtn.className = "btn-close";
            closeBtn.setAttribute("aria-label", "Close");
            closeBtn.addEventListener("click", function() {
                container.textContent = "";
            });
            alertDiv.appendChild(closeBtn);

            container.appendChild(alertDiv);
        }

        function createVehicleCard(vehicle) {
            const col = document.createElement("div");
            col.className = "col";

            const card = document.createElement("div");
            card.className = "card h-100";
            if (selectedVehicleId === vehicle.id) {
                card.classList.add("border-primary");
            }

            const cardBody = document.createElement("div");
            cardBody.className = "card-body d-flex flex-column";

            const headerDiv = document.createElement("div");
            headerDiv.className = "d-flex justify-content-between align-items-start mb-2";

            const title = document.createElement("h5");
            title.className = "card-title mb-0";
            title.textContent = vehicle.brand + " " + vehicle.model;

            const badge = document.createElement("span");
            badge.className = vehicle.available ? "badge bg-success" : "badge bg-secondary";
            badge.textContent = vehicle.available ? "Available" : "Unavailable";

            headerDiv.appendChild(title);
            headerDiv.appendChild(badge);

            const typeP = document.createElement("p");
            typeP.className = "card-text mb-1 text-muted";
            typeP.textContent = "Type: " + vehicle.type;

            const seatsP = document.createElement("p");
            seatsP.className = "card-text mb-1";
            seatsP.textContent = "Seats: " + vehicle.seats;

            const fuelP = document.createElement("p");
            fuelP.className = "card-text mb-1";
            fuelP.textContent = "Fuel: " + vehicle.fuel;

            const rateP = document.createElement("p");
            rateP.className = "card-text fw-bold text-primary mb-3";
            rateP.textContent = "$" + Number(vehicle.dailyRate).toFixed(2) + " / day";

            const btnWrapper = document.createElement("div");
            btnWrapper.className = "mt-auto";

            const selectBtn = document.createElement("button");
            selectBtn.type = "button";
            selectBtn.className = "btn btn-outline-primary w-100";
            if (!vehicle.available) {
                selectBtn.disabled = true;
                selectBtn.textContent = "Select";
            } else if (selectedVehicleId === vehicle.id) {
                selectBtn.textContent = "Selected";
                selectBtn.classList.remove("btn-outline-primary");
                selectBtn.classList.add("btn-primary");
            } else {
                selectBtn.textContent = "Select";
                selectBtn.addEventListener("click", function() {
                    selectedVehicleId = vehicle.id;
                    renderVehicles();
                });
            }

            btnWrapper.appendChild(selectBtn);

            cardBody.appendChild(headerDiv);
            cardBody.appendChild(typeP);
            cardBody.appendChild(seatsP);
            cardBody.appendChild(fuelP);
            cardBody.appendChild(rateP);
            cardBody.appendChild(btnWrapper);

            card.appendChild(cardBody);
            col.appendChild(card);
            return col;
        }

        function renderVehicles() {
            const grid = document.getElementById("vehicle-grid");
            grid.textContent = "";

            const filtered = vehicles.filter(function(v) {
                if (currentFilter === "ALL") {
                    return true;
                }
                return v.type === currentFilter;
            });

            filtered.forEach(function(vehicle) {
                const cardCol = createVehicleCard(vehicle);
                grid.appendChild(cardCol);
            });
        }

        async function loadVehicles() {
            try {
                const response = await fetch("/api/vehicles");
                if (!response.ok) {
                    throw new Error("Failed to load vehicles");
                }
                vehicles = await response.json();
                renderVehicles();
            } catch (err) {
                showAlert(err.message, "danger");
            }
        }

        async function addVehicle(payload) {
            try {
                const response = await fetch("/api/vehicles", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: new URLSearchParams(payload)
                });

                if (response.status === 201) {
                    const created = await response.json();
                    vehicles.push(created);
                    renderVehicles();
                    showAlert("Vehicle added successfully", "success");
                    return true;
                }

                const data = await response.json();
                const errorMessage = data && data.error ? data.error : "Failed to add vehicle";
                showAlert(errorMessage, "danger");
                return false;
            } catch (err) {
                showAlert(err.message, "danger");
                return false;
            }
        }

        function checkoutData() {
            return {
                vehicleId: selectedVehicleId || "",
                rentalDays: document.getElementById("rental-days").value,
                customerId: document.getElementById("customer-id").value.trim(),
                email: document.getElementById("customer-email").value.trim()
            };
        }

        document.getElementById("quote-button").addEventListener("click", async function() {
            const data = checkoutData();
            if (!data.vehicleId) {
                showAlert("Select an available vehicle first", "warning");
                return;
            }
            try {
                const response = await fetch("/api/quote", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: new URLSearchParams({ vehicleId: data.vehicleId, rentalDays: data.rentalDays })
                });
                const result = await response.json();
                if (!response.ok) {
                    throw new Error(result.error || "Could not calculate quote");
                }
                document.getElementById("quote-result").textContent = "Rental total: $" + result.totalPrice;
            } catch (err) {
                showAlert(err.message, "danger");
            }
        });

        document.getElementById("checkout-button").addEventListener("click", async function() {
            const data = checkoutData();
            if (!data.vehicleId) {
                showAlert("Select an available vehicle first", "warning");
                return;
            }
            try {
                const response = await fetch("/api/checkout", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: new URLSearchParams(data)
                });
                const result = await response.json();
                if (!response.ok) {
                    throw new Error(result.error || "Could not complete reservation");
                }
                document.getElementById("quote-result").textContent = "";
                showAlert("Booking confirmed. Reservation " + result.id + ", total $" + result.totalPrice,
                    "success");
                selectedVehicleId = null;
                await loadVehicles();
            } catch (err) {
                showAlert(err.message, "danger");
            }
        });

        document.getElementById("filter-group").addEventListener("click", function(e) {
            if (e.target.tagName !== "BUTTON") {
                return;
            }
            const buttons = this.querySelectorAll("button");
            buttons.forEach(function(btn) {
                btn.classList.remove("active");
            });
            e.target.classList.add("active");
            currentFilter = e.target.getAttribute("data-filter");
            renderVehicles();
        });

        document.getElementById("add-vehicle-form").addEventListener("submit", async function(e) {
            e.preventDefault();

            const type = document.getElementById("vehicle-type").value;
            const brand = document.getElementById("vehicle-brand").value.trim();
            const model = document.getElementById("vehicle-model").value.trim();
            const seats = parseInt(document.getElementById("vehicle-seats").value, 10);
            const fuel = document.getElementById("vehicle-fuel").value.trim();
            const dailyRate = parseFloat(document.getElementById("vehicle-rate").value);

            const payload = {
                type: type,
                brand: brand,
                model: model,
                seats: seats,
                fuel: fuel,
                dailyRate: dailyRate
            };

            const success = await addVehicle(payload);
            if (success) {
                this.reset();
            }
        });

        loadVehicles();
    </script>
</body>
</html>
